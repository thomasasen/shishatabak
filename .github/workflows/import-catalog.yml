name: Katalogdaten aus öffentlichen Quellen abrufen

on:
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/import_products.py'
      - 'scripts/import_listings.py'
      - 'scripts/test_import_products.py'
      - 'scripts/test_import_listings.py'
      - 'scripts/audit_catalog.py'
      - 'scripts/test_audit_catalog.py'
      - '.github/workflows/import-catalog.yml'

permissions:
  contents: write

concurrency:
  group: tabak-catalog-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HTTP/HTML parsers
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test parsers
        run: |
          python -m unittest discover -s scripts -p test_import_products.py -v
          python -m unittest discover -s scripts -p test_import_listings.py -v
      - name: Collect CC0 and permitted public product facts
        run: python scripts/import_products.py --max-requests 370 --max-products 300 --delay 1.0
      - name: Collect retailer listing GTINs (separate card-level verification)
        run: python -m scripts.import_listings --max-pages 48 --delay 1.1
      - name: Archive source-by-source audit report
        uses: actions/upload-artifact@v4
        with:
          name: tabak-import-report
          path: |
            catalog/import-report.json
            catalog/listing-import-report.json
            catalog/audit-report.json
          retention-days: 30
      - name: Generate browser catalog and validate GTINs
        run: |
          python -m unittest discover -s scripts -p test_audit_catalog.py -v
          python -m scripts.audit_catalog
          node scripts/build-catalog.mjs
          node scripts/build-catalog.mjs --check
          node --test tests/*.test.mjs
      - name: Push import changes to a separate review branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/products.json catalog.js catalog/import-report.json catalog/listing-import-report.json catalog/audit-report.json
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git checkout -b "data/collect-$RUN_ID"
          git commit -m "data: import source-attributed product facts (run $RUN_ID)"
          git push origin "HEAD:refs/heads/data/collect-$RUN_ID"
          echo "Created review branch data/collect-$RUN_ID"
