name: Schneller Turaah-EAN-Abgleich
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fast-turaah.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast-turaah-ean
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test import validators
        run: |
          python -m unittest discover -s scripts -p test_import_products.py -v
          python -m unittest discover -s scripts -p test_import_listings.py -v
      - name: Import all publicly accessible Turaah GTIN pages
        run: python scripts/import_products.py --only-source Turaah --max-requests 300 --max-products 230 --delay 0.85
      - name: Validate resulting GTIN catalog
        run: |
          python -m scripts.audit_catalog
          node scripts/build-catalog.mjs
          node scripts/build-catalog.mjs --check
          node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fast-turaah-report
          path: |
            catalog/import-report.json
            catalog/audit-report.json
          retention-days: 30
      - name: Push review branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/products.json catalog.js catalog/import-report.json catalog/audit-report.json
          if git diff --cached --quiet; then
            echo "No new Turaah records"
            exit 0
          fi
          git checkout -b "data/turaah-$RUN_ID"
          git commit -m "data: Turaah sourced GTIN import $RUN_ID"
          git push origin "HEAD:refs/heads/data/turaah-$RUN_ID"
