name: Diagnose zusätzliche Shisha-Quellen
on:
  push:
    branches: [main]
    paths: ['scripts/diagnose_extended.py', '.github/workflows/diagnose-extended.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - run: python -m scripts.diagnose_extended
