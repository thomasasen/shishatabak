name: Prüfe offizielle EU-CEG Tabakliste auf EAN
on:
  push:
    branches: [main]
    paths: ['scripts/probe_euceg.py', '.github/workflows/probe-euceg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install 'requests>=2.32,<3'
      - run: python -m scripts.probe_euceg
