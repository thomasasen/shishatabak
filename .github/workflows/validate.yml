name: Pilot checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate GTIN catalog and generated browser data
        run: node scripts/build-catalog.mjs --check
      - name: Red-team catalog integrity
        run: |
          python -m scripts.audit_catalog
          python -m unittest discover -s scripts -p test_audit_catalog.py -v
      - name: Run smoke tests
        run: node --test tests/*.test.mjs
