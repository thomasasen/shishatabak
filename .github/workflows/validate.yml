name: Pilot checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate GTIN catalog and generated browser data
        run: node scripts/build-catalog.mjs --check
      - name: Red-team catalog integrity
        run: |
          python -m scripts.audit_catalog
          python -m unittest discover -s scripts -p test_audit_catalog.py -v
      - name: Test JTL EAN exporter discovery and conservatism
        run: |
          python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
          python -m unittest discover -s scripts -p 'test_shisha_ean_export*.py' -v
      - name: Run smoke tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright and Chromium for actual browser verification
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test actual browser form submission, persistence and draft recovery
        run: python tests/browser_save.py
      - name: Comprehensive virtual QA team across all browsers and functions
        run: python tests/browser_qa.py
