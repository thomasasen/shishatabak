<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Privates Tabakjournal: persönliche Verträglichkeitsbewertungen und Geschmack deiner Tabake. Daten bleiben lokal im Browser.">
  <title>Meine Tabake · Verträglichkeit bewerten</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./catalog.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-collection" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8m-3-3 3 3-3 3M16 15H8m3-3-3 3 3 3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16v4ZM13 7l4 4M14 4l2-2 4 4-2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-shisha" viewBox="0 0 32 36">
      <path d="M12.5 6h7M14 4h4M16 6v15M13 11h6M12 21c-3 2.7-5.5 5.8-5.5 8.4 0 3.3 3.8 4.5 9.5 4.5s9.5-1.2 9.5-4.5c0-2.6-2.5-5.7-5.5-8.4H12ZM10.5 29.5c3.5 1.7 7.5 1.7 11 0M16 14h4c5.1 0 6.8 4.4 4.2 8.2M24.2 22.2c2 0 4.5 1.4 3.6 3.2-.6 1.1-2.2 1.4-3.2.5M12.3 3.5c-1-1.5 1.1-1.8.3-3M18.8 3.5c1-1.5-1.1-1.8-.3-3"/>
    </symbol>
  </svg>
  <a class="skip-link" href="#screen">Zum Inhalt springen</a>
  <div class="app-shell">
    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="topbar-brand" data-view="collection" aria-current="page" aria-label="Meine Tabake öffnen">
          <span class="brand-mark" aria-hidden="true">T<span>.</span></span>
          <span class="brand-text">Tabakjournal</span>
        </button>
        <div class="topbar-actions">
          <span class="save-state" id="saveStatus" role="status" aria-live="polite">Lokal gespeichert</span>
          <button class="btn btn-secondary btn-sm utility-action" type="button" data-view="data" aria-label="Backup verwalten" title="Backup verwalten">
            <svg class="ui-icon" aria-hidden="true"><use href="#i-data"/></svg><span class="action-label">Backup</span>
          </button>
          <button class="btn btn-primary btn-sm" type="button" data-action="add-tobacco" title="Tabak hinzufügen" aria-label="Tabak hinzufügen">
            <svg class="ui-icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="action-label">Tabak hinzufügen</span>
          </button>
        </div>
      </header>
      <main id="screen" class="content" tabindex="-1"></main>
      <footer class="footer">Deine persönlichen Tabakbewertungen bleiben lokal in diesem Browser. Regelmäßig ein <a href="#" data-view="data">Backup</a> erstellen.</footer>
    </div>
  </div>
  <dialog id="editorDialog" class="editor-dialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
